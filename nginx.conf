log_format bp_safe '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent';
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 11m;
  access_log /var/log/nginx/access.log bp_safe;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com" always;
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
  }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control public;
  }
}
